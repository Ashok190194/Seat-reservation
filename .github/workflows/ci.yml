name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seats
          POSTGRES_PASSWORD: seats
          POSTGRES_DB: seats
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seats -d seats"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      DATABASE_URL: postgres://seats:seats@127.0.0.1:5432/seats?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal)" || { gofmt -l ./cmd ./internal; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test (race, against Postgres)
        run: go test ./... -count=1 -race
      - name: smoke the server and run a small burst
        run: |
          go build -o /tmp/server ./cmd/server
          PORT=8787 /tmp/server > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:8787/readyz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS localhost:8787/readyz
          go run ./cmd/burst -url http://localhost:8787 -requests 2000 -concurrency 100 -hot-users 100 -users 300 -seats 200
          grep -q '"status":5' /tmp/server.log && { echo "server logged a 5xx"; exit 1; } || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: seat-reservation:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
