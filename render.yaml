# Render Blueprint: one web service + one Postgres, both on the free tier.
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
services:
  - type: web
    name: seat-reservation
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /readyz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seat-reservation-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: TOKEN_SECRET
        generateValue: true
      - key: DB_MAX_CONNS
        value: "16"
      - key: LOG_LEVEL
        value: info

databases:
  - name: seat-reservation-db
    plan: free
    region: singapore
    databaseName: seats
    user: seats
